name: propel

x-backend-environment: &backend-environment
  SERVICE_NAME: propel-backend
  ENVIRONMENT: development
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://propel:propel@database:5432/propel}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_POOL_OVERFLOW: ${DATABASE_POOL_OVERFLOW:-5}
  TELEMETRY_STREAM_NAME: ${TELEMETRY_STREAM_NAME:-propel:telemetry}
  TELEMETRY_REQUEST_TIMEOUT_SECONDS: ${TELEMETRY_REQUEST_TIMEOUT_SECONDS:-2}
  TELEMETRY_MAX_REQUEST_BYTES: ${TELEMETRY_MAX_REQUEST_BYTES:-16384}
  TELEMETRY_BATCH_MAX_REQUEST_BYTES: ${TELEMETRY_BATCH_MAX_REQUEST_BYTES:-1048576}
  TELEMETRY_BATCH_MAX_ITEMS: ${TELEMETRY_BATCH_MAX_ITEMS:-500}
  TELEMETRY_CONSUMER_GROUP: ${TELEMETRY_CONSUMER_GROUP:-propel-telemetry-workers}
  TELEMETRY_CONSUMER_NAME: ${TELEMETRY_CONSUMER_NAME:-telemetry-worker-1}
  TELEMETRY_CONSUMER_BATCH_SIZE: ${TELEMETRY_CONSUMER_BATCH_SIZE:-50}
  TELEMETRY_PROCESSING_CONCURRENCY: ${TELEMETRY_PROCESSING_CONCURRENCY:-10}
  TELEMETRY_CONSUMER_BLOCK_MS: ${TELEMETRY_CONSUMER_BLOCK_MS:-1000}
  TELEMETRY_PENDING_IDLE_MS: ${TELEMETRY_PENDING_IDLE_MS:-5000}
  TELEMETRY_MAX_DELIVERIES: ${TELEMETRY_MAX_DELIVERIES:-3}
  TELEMETRY_STALE_AFTER_SECONDS: ${TELEMETRY_STALE_AFTER_SECONDS:-1920}
  TELEMETRY_STALE_SCAN_INTERVAL_SECONDS: ${TELEMETRY_STALE_SCAN_INTERVAL_SECONDS:-30}
  TELEMETRY_STALE_SCAN_BATCH_SIZE: ${TELEMETRY_STALE_SCAN_BATCH_SIZE:-500}
  TELEMETRY_DEAD_LETTER_STREAM_NAME: ${TELEMETRY_DEAD_LETTER_STREAM_NAME:-propel:telemetry:dead-letter}
  ANALYSIS_DUE_SET_NAME: ${ANALYSIS_DUE_SET_NAME:-propel:analysis:due}
  ANALYSIS_DEBOUNCE_SECONDS: ${ANALYSIS_DEBOUNCE_SECONDS:-10}
  ANALYSIS_LIVE_FRESHNESS_SECONDS: ${ANALYSIS_LIVE_FRESHNESS_SECONDS:-1920}
  ANALYSIS_RETRY_DELAY_SECONDS: ${ANALYSIS_RETRY_DELAY_SECONDS:-5}
  ANALYSIS_DT_FAULT_RATIO: ${ANALYSIS_DT_FAULT_RATIO:-0.6}
  ANALYSIS_DT_MIN_BRANCHES: ${ANALYSIS_DT_MIN_BRANCHES:-2}
  ANALYSIS_FEEDER_FAULT_RATIO: ${ANALYSIS_FEEDER_FAULT_RATIO:-0.6}
  ANALYSIS_FEEDER_MIN_DTS: ${ANALYSIS_FEEDER_MIN_DTS:-2}
  ANALYSIS_CORRELATION_WINDOW_SECONDS: ${ANALYSIS_CORRELATION_WINDOW_SECONDS:-10}
  SCHEDULED_OUTAGE_EARLY_GRACE_SECONDS: ${SCHEDULED_OUTAGE_EARLY_GRACE_SECONDS:-600}
  SCHEDULED_OUTAGE_OVERRUN_GRACE_SECONDS: ${SCHEDULED_OUTAGE_OVERRUN_GRACE_SECONDS:-2400}
  WORKER_RETRY_DELAY_SECONDS: ${WORKER_RETRY_DELAY_SECONDS:-1}
  RESTORATION_THRESHOLD: ${RESTORATION_THRESHOLD:-0.8}
  RESTORATION_STABILIZATION_SECONDS: ${RESTORATION_STABILIZATION_SECONDS:-10}
  SIMULATOR_TELEMETRY_URL: ${SIMULATOR_TELEMETRY_URL:-http://127.0.0.1:8000/api/telemetry}
  SIMULATOR_REQUEST_TIMEOUT_SECONDS: ${SIMULATOR_REQUEST_TIMEOUT_SECONDS:-3}
  SIMULATOR_HEARTBEAT_INTERVAL_SECONDS: ${SIMULATOR_HEARTBEAT_INTERVAL_SECONDS:-600}
  SIMULATOR_HEARTBEAT_BATCH_SIZE: ${SIMULATOR_HEARTBEAT_BATCH_SIZE:-500}
  SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
  SIMULATOR_GENERATED_NETWORK_ENABLED: ${SIMULATOR_GENERATED_NETWORK_ENABLED:-true}
  SIMULATOR_GENERATION_SEED: ${SIMULATOR_GENERATION_SEED:-7307}
  SIMULATOR_GENERATION_SUBSTATIONS: ${SIMULATOR_GENERATION_SUBSTATIONS:-2}
  SIMULATOR_GENERATION_FEEDERS_PER_SUBSTATION: ${SIMULATOR_GENERATION_FEEDERS_PER_SUBSTATION:-2}
  SIMULATOR_GENERATION_TRANSFORMERS_PER_FEEDER: ${SIMULATOR_GENERATION_TRANSFORMERS_PER_FEEDER:-4}
  SIMULATOR_GENERATION_MIN_POLES_PER_TRANSFORMER: ${SIMULATOR_GENERATION_MIN_POLES_PER_TRANSFORMER:-115}
  SIMULATOR_GENERATION_MAX_POLES_PER_TRANSFORMER: ${SIMULATOR_GENERATION_MAX_POLES_PER_TRANSFORMER:-135}
  SIMULATOR_GENERATION_SURVEYED_TRANSFORMER_RATIO: ${SIMULATOR_GENERATION_SURVEYED_TRANSFORMER_RATIO:-0.4}
  SIMULATOR_GENERATION_SENSOR_COVERAGE_RATIO: ${SIMULATOR_GENERATION_SENSOR_COVERAGE_RATIO:-0.91}
  SIMULATOR_GENERATION_OFFLINE_DEVICE_RATIO: ${SIMULATOR_GENERATION_OFFLINE_DEVICE_RATIO:-0.04}
  SIMULATOR_GENERATION_FIRMWARE_12_RATIO: ${SIMULATOR_GENERATION_FIRMWARE_12_RATIO:-0.08}

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: runtime

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propel}
      POSTGRES_USER: ${POSTGRES_USER:-propel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  init:
    build: *backend-build
    command: ["propel-init"]
    environment: *backend-environment
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend-api:
    build: *backend-build
    command: ["uvicorn", "propel.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  telemetry-worker:
    build: *backend-build
    command: ["propel-worker"]
    environment:
      <<: *backend-environment
      SIMULATOR_TELEMETRY_URL: http://backend-api:8000/api/telemetry
    depends_on:
      init:
        condition: service_completed_successfully
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  backend-tests:
    profiles: ["test"]
    build:
      <<: *backend-build
      target: test
    command: ["pytest", "-m", "integration"]
    environment: *backend-environment
    volumes:
      - ./docs:/docs:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_OSM_TILE_URL: ${VITE_OSM_TILE_URL:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    command: ["pnpm", "check"]
    restart: "no"

  frontend-e2e:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  redis-data:
